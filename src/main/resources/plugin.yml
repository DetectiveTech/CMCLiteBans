name: CMCLite
version: 1.0
main: com.LiteBansByCMC.BausmePlugin
api-version: 1.21
authors:
  - DetectiveTech
depend: [LiteBans]
softdepend: [AuthMe, CoreProtect]
commands:
  bausme:
    description: Opens the punishment addon menu or manages history
    usage: /bausme [reload | nuimti <type> <player>]
  patikra:
    description: Patikros (ScreenShare) sistema
    usage: /patikra <player> <discord>
    permission: bausme.patikra
permissions:
  bausme.use:
    description: Allows opening the menu
    default: false
  bausme.patikra:
    description: Leidžia naudoti patikros komandą
    default: op
  bausme.admin:
    description: Allows reloading the plugin and bypasses limits
    default: op
  # Ranks defined in config
  # KEEP THESE AS DOTS (.) because these are the actual permissions
  bausme.limit.bcm:
    description: BCM Rank punishment limits
    default: false
  bausme.limit.chatmod:
    description: ChatMod Rank punishment limits
    default: false
  bausme.limit.band.priz:
    description: Band.Priz Rank punishment limits
    default: false
  bausme.limit.priz:
    description: Priz Rank punishment limits
    default: false
  # Cooldown permissions
  bausme.cooldown.bcm:
    default: false
  bausme.cooldown.cm:
    default: false
  bausme.cooldown.bpriz:
    default: false
  bausme.cooldown.priz:
    default: false