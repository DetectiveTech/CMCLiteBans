# --- ESCALATION RULES ---
# KODAI PAKEISTI Į #XXX FORMATĄ
# 100+ = CHAT
# 200+ = GAMEPLAY
# 300+ = SEVERE

escalation:
  # 1. Keiksmai/Įžeidimai
  chat_keiksmai:
    check-table: "mutes"
    reason-filter: "#101"
    permission-limits:
      bausme-limit-bcm: 3
      bausme-limit-chatmod: 3
      bausme-limit-band-priz: 3
      bausme-limit-priz: 3
    levels:
      0: "warn {player} Keiksmai/Įžeidimai (1 k.) #101"
      1: "mute {player} 15m Keiksmai/Įžeidimai (2 k.) #101"
      2: "mute {player} 30m Keiksmai/Įžeidimai (3 k.) #101"
      3: "mute {player} 1h Keiksmai/Įžeidimai (4 k.) #101"

  # 2. Admin įžeidimai
  chat_admin_izeidimai:
    check-table: "mutes"
