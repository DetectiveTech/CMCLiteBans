# CMCLiteBans Configuration

# 1. Run command before punishment (useful for unjailing before banning)
# Use {player} for the target name. Leave empty to disable.
run_command_before_ban: "unjail {player} jail"

# 2. List of Discord IDs for Tab Completion in /patikra
# These will show up when typing /patikra <player> [TAB]
patikra_discords:
  - "admin_dc_1"
  - "admin_dc_2"
  - "pagalba_dc"

# 5. Notify higher ranks if an admin hits their limit
# {admin} = admin name, {target} = player name, {level} = attempted level, {req_level} = required level
if_player_gives_to_low_punishment: "helpop Administratorius {admin} suteikė bausmę lygiu: {level}, tačiau reikėjo {req_level}. Aukštesni rangai, prašome patikrinti."

# Set this to 'true' if you want to use your own MySQL/MariaDB connection.
# Set this to 'false' to use the LiteBans API connection (Recommended if LiteBans is installed).
use-custom-database: false

database:
  host: "localhost"
  port: "3308"
  user: ""
  password: ""
  database_name: ""
  table_prefix: "litebans_"

# --- NEW FEATURES ---
use-mysql-stats: true

discord:
  enabled: true
  webhook-url: "https://discord.com/api/webhooks/YOUR_WEBHOOK_URL"
  avatar-url: "https://minotar.net/helm/{admin}/100.png"
  username: "Bausmės Bot"

aes:
  points: {ban: 10, mute: 2, warn: 1, kick: 1, jail: 2}
  revoked-penalty: -50

alts:
  check-on-select: true
  warning-threshold: 1

cooldowns:
  default: 300
  ranks:
    bcm:
      permission: "bausme.cooldown.bcm"
      time: 60
    cm:
      permission: "bausme.cooldown.cm"
      time: 60
    bpriz:
      permission: "bausme.cooldown.bpriz"
      time: 30
    priz:
      permission: "bausme.cooldown.priz"
      time: 10

admin-stats:
  reset-days: 7
  last-reset: 0
  timezone: "Europe/Vilnius"

history-filter:
  bans: "30d"
  mutes: "24h"
  warns: "24h"
  kicks: "24h"

# --- MAIN GUI ---
gui:
  title: "&8Administracija"
  size: 54
  items:
    admin_head:
      slot: 4
      material: PLAYER_HEAD
      name: "&6&l%admin%"
      lore:
        - "&7&m-----------------"
        - "&7Viso nubausta: &e%total%"
        - "&7Banai: &c%bans%"
        - "&7Mutes: &b%mutes%"
        - "&7&m-----------------"
        - "&8Reset in: &f%reset_days%d"

    select_player:
      slot: 13
      material: PLAYER_HEAD
      name: "&b&lPasirinkti Žaidėją"
      lore:
        - "&7Dabartinis: &a%target%"
